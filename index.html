<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>7 Wonders Duel: Solo Mode</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        /* Custom styles for image dimensions */
        .leader-card {
            height: 65; /* 65% of the viewport height */
            width: calc(65 * 860 / 1265); /* Maintain aspect ratio */
        }
        .deck-card {
            height: 12vh; /* Further reduce height for better fit */
            width: calc(12vh * 857 / 554); /* Maintain aspect ratio */
        }
        body {
            background-image: url('images/Background.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen">
    <div class="flex flex-col items-center">
        <div class="flex space-x-4 mb-4">
            <button id="newGameBtn" class="px-4 py-2 bg-blue-500 text-white rounded">New Game</button>
            <button id="reshuffleBtn" class="px-4 py-2 bg-gray-400 text-white rounded" disabled>Reshuffle</button>
        </div>
        <div class="flex flex-col items-center">
            <img id="leaderCard" src="images/Leaders/LeaderCardBack.png" alt="Leader Card" class="leader-card cursor-pointer">
            <div class="flex space-x-4 mt-4">
                <img id="playDeckCard" src="images/Deck/DeckCardBack.png" alt="Play Deck Card" class="deck-card cursor-pointer">
                <img id="lastDrawnCard" src="images/Deck/DeckCardBack.png" alt="Last Drawn Card" class="deck-card opacity-0">
            </div>
            <p id="playDeckInfo" class="text-center mt-2">Cards Drawn: 0</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
